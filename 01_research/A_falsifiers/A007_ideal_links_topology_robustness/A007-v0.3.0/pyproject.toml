[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-ideal-links-suite"
version = "0.3.0"
description = "Native ideal-link geometry plus reduced Hessian, candidate symplectic and QM-readiness diagnostics."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "tabulate>=0.9",
  "pybind11>=2.11",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
sst-ideal-links = "sst_link_suite.cli:main"
sst-ideal-links-qm = "sst_link_suite.qm_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-fourier-ideal-falsifier"
version = "0.1.1"
description = "Blind paired dynamical falsifier for Fourier-series versus ideal/relaxed vortex-knot seeds"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
native = ["pybind11>=2.12", "setuptools>=70", "wheel"]
test = ["pytest>=8"]

[project.scripts]
sst-fvi = "sst_fourier_ideal_falsifier.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-katlas-link-geometry-conditioning"
version = "2.0.0"
description = "Topology-guarded geometry conditioning compiler for Katlas link PD presentations"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "networkx>=3.4"]

[tool.setuptools.packages.find]
where = ["src"]

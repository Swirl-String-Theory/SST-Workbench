release:
  name: SST Seven-Article Closure & Holonomy Blind Falsifier
  version: 0.1.2
  target_canon: v0.8.35
  status: research audit package
scientific_policy:
  blind_case_ids: true
  thresholds_frozen_before_scoring: true
  holdout_default: 0.30
  missing_physical_fields: INDETERMINATE
  source_system_formulas_promoted_to_sst_laws: false
  multicomponent_topology: centerline_reference_only
blind_integrity:
  byte_stable_freeze: true
  reveal_refuses_freeze_mismatch: true
  private_mapping_commitment_verified: true
  same_snapshot_reuses_ids_and_split: true
  snapshot_state_directory: results/_blind_state
parser:
  explicit_component_separators: true
  validated_jump_fallback: true
  jump_factor: 5.0
  fallback_component_closure_max: 0.05
native:
  language: C++17
  binding: pybind11
  openmp_default: true
default_dataset: ../../KnotPlot/knots/final
artifacts:
  - CONVERSATION_SYNTHESIS.md
  - canon_patch/SST_CANON-v0.8.35-seven-article-closure-addendum.tex
  - canon_patch/SST_CANON-v0.8.35-research-track-seven-article-closure-addendum.tex
  - canon_patch/bibliography_additions.tex
  - V0.1.1_RESULTS_AUDIT.md
  - run_all_both.cmd
  - CHANGELOG_v0.1.2.md
  - HOTFIX_v0.1.1_to_v0.1.2.diff
validation:
  python_selftest: PASS
  blind_infrastructure_selftest: PASS
  cpp_source_portability_fix: "PASS: standard C++17 index type"
  native_build_helper_postbuild_import_check: PASS
  openmp_policy: "preferred; automatic serial fallback if unavailable"
  v0_1_1_output_regression: "49-case prepared-data audit used during v0.1.2 development"

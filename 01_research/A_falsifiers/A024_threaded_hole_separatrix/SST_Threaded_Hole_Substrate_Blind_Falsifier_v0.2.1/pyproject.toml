[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-threaded-hole-falsifier"
version = "0.2.1"
description = "Blind threaded-hole self-confinement and pressure-Poisson falsifier for SST vortex carriers"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["sst_threaded_hole_falsifier"]

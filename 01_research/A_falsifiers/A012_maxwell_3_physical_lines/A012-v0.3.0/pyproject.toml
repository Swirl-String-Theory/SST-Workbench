[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-maxwell3-physical-lines-falsifier"
version = "0.3.0"
description = "PKLSA-v0.3 source-native blind Maxwell-Hopf/topological-circulation falsifier with C++/pybind11/OpenMP kernels"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]

[project.scripts]
sst-maxwell3 = "sst_maxwell3_blind.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["sst_maxwell3_blind"]

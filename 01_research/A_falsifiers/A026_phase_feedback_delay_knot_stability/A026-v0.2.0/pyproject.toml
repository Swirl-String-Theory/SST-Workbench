[build-system]
requires = ["setuptools>=75", "wheel", "pybind11>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-phase-delay-knot-falsifier"
version = "0.2.1"
description = "Blind C++17/pybind11 falsifier for phase-feedback-delay stability in vortex knots"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["sst_phase_delay_falsifier"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pklsa-universal-adapter"
version = "0.1.0"
description = "Read-only, version-pinned E010 v0.4.0 dataset adapter for SST-Workbench"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
pklsa-adapter = "pklsa_bridge.cli:main"

[tool.setuptools]
packages = ["pklsa_bridge"]

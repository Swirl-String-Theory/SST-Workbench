[project]
id = "A016"
name = "helmholtz_vorticity_population_matter_field_partition"
version = "v0.2.0"
package = "experiment"
profile = "cpu"
framework_version = "1.0.6"

[blind]
enabled = true
policy_file = "blind_policy.json"

[report]
tex = "report/FALSIFIER_REPORT.tex"
require_complete_before_freeze = true
compile_pdf = true
pdf_required = false
publish_to_instance_parent = true

[run]
seed = 1858

[sources]
multilibrary_required = false
independent_confirmation_required = false

[experiment]
input_glob = "*_final.txt"
max_files_basic = 3
max_files_full = 0
max_files_certify = 0
resample_n_basic = 96
convergence_n_basic = 160
resample_n_full = 160
convergence_n_full = 256
resample_n_certify = 256
convergence_n_certify = 384
core_radius_scale = 1.0
holonomy_stations_per_component = 3
holonomy_loop_points = 96
holonomy_loop_radius_as_thickness = 0.25
holonomy_source_factor = 4
exterior_directions = 18
exterior_radius_factor = 3.0
exterior_fd_fraction = 0.002
energy_samples_low = 1024
energy_samples_high = 4096
energy_domain_radius_factor = 4.0
source_zone_core_multiples = 2.0
far_field_directions = 24
far_field_radius_factors = [4.0, 6.0, 8.0, 12.0]

[thresholds]
geometry_min_vertices = 32
geometry_closure_edge_ratio_max = 2.5
geometry_min_thickness_over_edge = 1.25
convergence_energy_rel_diff_max = 0.08
convergence_re_abs_diff_max = 0.08
holonomy_integer_abs_error_max = 0.08
holonomy_min_valid_loops = 2
relative_equilibrium_normal_nrmse_max = 0.18
symmetry_orientation_relative_error_max = 1e-9
symmetry_mirror_relative_error_max = 1e-9
cauchy_relative_error_max = 1e-12
jacobian_abs_error_max = 1e-12
flux_relative_error_max = 1e-12
exterior_div_dimensionless_max = 0.08
exterior_curl_dimensionless_max = 0.08
exterior_min_valid_points = 8
exterior_energy_fraction_min = 0.01
exterior_energy_fraction_refinement_abs_max = 0.12
far_field_fit_r2_min = 0.97
far_field_exponent_min = 2.4
far_field_exponent_max = 3.6
far_field_min_eligible = 1
cpp_python_relative_l2_max = 1e-10

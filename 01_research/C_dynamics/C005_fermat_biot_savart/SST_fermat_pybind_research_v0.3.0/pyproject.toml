[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-fermat-pybind-research"
version = "0.3.0"
description = "Standalone Python+C++ pybind11 research harness for SST Fermat-critical diagnostics with adaptive softening/resolution studies across 0_1, 3_1, 4_1, and 5_2"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["fermat_ext"]

[tool.setuptools.package-data]
fermat_ext = ["data/*.json"]

[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-fermat-pybind-research"
version = "0.4.3"
description = "Standalone Python+C++17 SST Fermat local-candidate harness with clock-domain component diagnostics, censored bifurcation thresholds, adaptive convergence scans, and resumable campaigns"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["fermat_ext"]

[tool.setuptools.package-data]
fermat_ext = ["data/*.json"]

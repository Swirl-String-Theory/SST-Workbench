[build-system]
requires = ["setuptools>=70", "wheel", "pybind11>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-qhp-stability-landscape"
version = "0.1.3"
description = "Blind QHP geometry-manifold stability landscape falsifier for closed finite-core vortex filaments"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "pybind11>=3.0"]

[project.scripts]
sst-qhp = "sst_qhp_falsifier.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-falsifier-framework"
version = "1.0.6"
description = "Shared SST falsification runtime: blinding, provenance, gates, native/GPU certification and reporting"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[tool.setuptools]
packages = ["sst_falsifier", "sst_falsifier.backends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

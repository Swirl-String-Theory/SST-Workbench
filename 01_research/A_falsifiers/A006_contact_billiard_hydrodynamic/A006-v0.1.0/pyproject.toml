[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-contact-billiard-hydrodynamic-falsifier"
version = "0.1.0"
description = "Falsification harness for contact maps, the trefoil 9-billiard, geometric force compatibility, and regularized finite-core hydrodynamics."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Omar Iskandarani / SST-Workbench research harness"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
sst-cbhf = "sstcbhf.cli:main"

[tool.setuptools.packages.find]
include = ["sstcbhf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

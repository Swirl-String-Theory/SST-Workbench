[build-system]
requires = ["setuptools>=70", "wheel", "pybind11>=2.13"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-kelvin-floquet-workbench"
version = "0.1.1"
description = "Four-phase C++/pybind11 Kelvin-wave, RPO/Floquet, resonance and transfer falsification workbench for SST"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[tool.setuptools]
packages = ["sst_kelvin_workbench"]

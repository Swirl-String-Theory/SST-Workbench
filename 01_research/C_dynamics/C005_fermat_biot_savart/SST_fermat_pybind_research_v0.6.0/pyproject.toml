[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-fermat-pybind-research"
version = "0.6.0"
description = "Standalone Python+C++17 SST Fermat research harness with local-candidate certification, full 3-D ray shooting, two-axis closed-orbit convergence, and reduced monodromy diagnostics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["fermat_ext"]

[tool.setuptools.package-data]
fermat_ext = ["data/*.json"]

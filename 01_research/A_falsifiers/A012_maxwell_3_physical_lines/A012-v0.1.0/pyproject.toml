[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-maxwell-blind-falsifier"
version = "0.1.0"
description = "Target-blind falsification harness for Maxwell-inspired SST mechanical closure tests"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
sst-maxwell-blind = "sst_maxwell_blind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

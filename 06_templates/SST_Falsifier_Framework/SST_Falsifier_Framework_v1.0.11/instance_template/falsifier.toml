[project]
id = "__CATALOG_ID__"
name = "__NAME__"
version = "__VERSION__"
package = "experiment"
profile = "__PROFILE__"
framework_version = "1.0.11"

[blind]
enabled = true
policy_file = "blind_policy.json"

[report]
tex = "report/FALSIFIER_REPORT.tex"
require_complete_before_freeze = true
compile_pdf = true
pdf_required = false
publish_to_instance_parent = true

[run]
seed = 123456789

# v1.0.11 automatically probes Python, C++ and Intel XPU each blind run.
# Falsifier-specific science requires experiment/backend_matrix.py.
[auto_backends]
enabled = true
require_all_devices = false
require_all_science = false

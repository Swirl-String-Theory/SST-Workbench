[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-trefoil-dynamic-seed-falsifier"
version = "0.1.1"
description = "Blind staged trefoil dynamic seed qualification: rolling onset to projected Floquet and finite-core causal gates"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "pybind11>=3.0"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["sst_seed_falsifier"]

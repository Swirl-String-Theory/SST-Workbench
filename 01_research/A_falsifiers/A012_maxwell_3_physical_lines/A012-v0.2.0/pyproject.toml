[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-maxwell3-physical-lines-falsifier"
version = "0.2.0"
description = "Prefix-3 blind SST/Maxwell Physical Lines of Force falsifier with C++/pybind11 Biot-Savart kernels"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.scripts]
sst-maxwell3 = "sst_maxwell3_blind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

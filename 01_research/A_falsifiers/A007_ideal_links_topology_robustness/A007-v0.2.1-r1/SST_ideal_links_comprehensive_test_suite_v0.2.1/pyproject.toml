[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-ideal-links-suite"
version = "0.2.1"
description = "Native C++17/pybind11 geometry, topology, contact and Biot-Savart diagnostics for ideal links."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "tabulate>=0.9",
  "pybind11>=2.11",
  "setuptools>=68",
  "wheel",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
sst-ideal-links = "sst_link_suite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

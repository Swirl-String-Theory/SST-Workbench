[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-intrinsic-modal-swirl-clock"
version = "0.2.2.5"
description = "Blind intrinsic modal swirl-clock falsifier with seed-provenance and mesh certification"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "pybind11>=3.0", "networkx>=3.4"]

[project.scripts]
sst-modal-clock = "sst_modal_clock.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

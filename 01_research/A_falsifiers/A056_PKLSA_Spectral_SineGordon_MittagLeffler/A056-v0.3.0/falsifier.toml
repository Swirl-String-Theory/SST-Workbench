[project]
id = "A056"
name = "A056"
version = "v0.3.0"
package = "experiment"
profile = "multilibrary_gpu"
framework_version = "1.0.4"

[blind]
enabled = true
policy_file = "blind_policy.json"

[report]
tex = "report/FALSIFIER_REPORT.tex"
require_complete_before_freeze = true
compile_pdf = true
pdf_required = false
publish_to_instance_parent = true

[run]
seed = 123456789

[a056]
default_input = "data/synthetic_blind"
basic_config = "configs/basic.json"
full_config = "configs/full.json"
framework_smoke_config = "configs/framework_smoke.json"
provider_schema = "A056-DYNAMIC-PROVIDER-5"

[a056_provider]
default_provider_config = "configs/provider_e010_filament_basic.json"

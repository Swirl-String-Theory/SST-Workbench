[build-system]
requires = ["setuptools>=75", "wheel", "pybind11>=2.13"]
build-backend = "setuptools.build_meta"

[project]
name = "einstein-sst-emergent-metric-poisson-gates"
version = "0.1.1"
description = "Blind Python/C++ falsifier for Einstein-SST emergent metric, 1/r monopole, and pressure-Poisson closure on relaxed knots"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.13", "pandas>=2.2", "matplotlib>=3.9", "tabulate>=0.9"]

[project.scripts]
einstein-sst-gates = "einstein_sst_gates.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sst21d-knot-order"
version = "0.1.0"
description = "SST-21D topology, geometry, and dynamical-order diagnostics for ideal-knot Fourier catalogues and KnotPlot/Ridgerunner outputs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
authors = [{name = "Omar Iskandarani / OpenAI research tooling"}]
license = {text = "MIT"}

[project.scripts]
sst21d = "sst21d.cli:main"

[tool.setuptools]
packages = ["sst21d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

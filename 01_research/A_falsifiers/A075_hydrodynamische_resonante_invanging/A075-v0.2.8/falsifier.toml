[project]
id = "A075"
name = "A075_Hydrodynamische_Resonante_Invanging"
version = "v0.2.8"
package = "experiment"
profile = "minimal"
framework_version = "1.1.0"

[blind]
enabled = true
policy_file = "blind_policy.json"

[report]
tex = "report/FALSIFIER_REPORT.tex"
require_complete_before_freeze = true
compile_pdf = true
pdf_required = false
publish_to_instance_parent = true

[run]
seed = 7501001

[sources]
independent_confirmation_required = true
multilibrary_required = true

[auto_backends]
enabled = true
minimum_science_backends = 2

[gpu]
provider = "intel"

# v0.2.8: legacy v1.1.0 flags enable explicit independent parity gates.
[backends.cpp]
enabled = true

[backends.sycl]
enabled = true # G6 evaluates torch XPU Euler, not the framework Biot-Savart worker.

[ruban_t23]
seed = "inputs/ruban_t23/RUBAN_T23_B0_0p154_N2048_EQUAL_ARCLENGTH.xyz"
B0_exact = "77/500"
delta_filament_exact = "1/20"
source_free_stability_study_default = false

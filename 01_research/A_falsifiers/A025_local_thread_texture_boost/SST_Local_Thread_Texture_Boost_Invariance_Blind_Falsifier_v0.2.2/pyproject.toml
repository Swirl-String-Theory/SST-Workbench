[build-system]
requires = ["setuptools>=70", "wheel", "pybind11>=3.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-local-thread-falsifier"
version = "0.2.2"
description = "Blind explicit closed vortex-thread / boost-invariance falsifier for SST research"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "pybind11>=3.0"]

[tool.setuptools]
packages = ["sst_thread_falsifier", "sst_thread_falsifier.native_ext"]

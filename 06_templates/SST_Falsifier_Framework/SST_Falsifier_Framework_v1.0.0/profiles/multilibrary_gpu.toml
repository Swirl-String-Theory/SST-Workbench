[framework]
schema = "SST-FALSIFIER-RUNTIME-2"
version = "1.0.0"
[backends.python]
enabled = true
authority = "REFERENCE"
precision = "float64"
[backends.cpp]
enabled = true
required_for_certify = true
accepted_actual = ["openmp", "serial"]
authority = "CERTIFICATION"
precision = "float64"
[backends.sycl]
enabled = true
required_for_certify = false
authority = "SCREENING_ONLY"
precision = "float32"
allow_fp32_screening = true
[parity]
cpp_vs_python_relative_l2 = 1e-10
gpu_vs_cpu_relative_l2 = 5e-4
[sources]
multilibrary_required = true
independent_confirmation_required = true

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-dimensionless-ratios"
version = "0.1.0"
description = "Research-track harness for dimensionless vortex-knot dynamical ratios"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.scripts]
sst-ratios = "sst_dimensionless_ratios:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["sst_dimensionless_ratios", "sstcore_bridge"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maxwell-sst-kinetic-falsifier"
version = "0.2.0"
description = "Solver-facing geometry, mode-coupling proxy and preregistered falsifier framework for Maxwell-SST kinetic closure."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
native = ["pybind11>=2.13"]
dev = ["pytest>=8"]
full = ["pybind11>=2.13", "pytest>=8"]

[project.scripts]
sst-maxwell-falsify = "maxwell_sst_falsifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

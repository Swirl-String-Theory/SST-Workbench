[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-sciii-koopman-dmd-complex-phase-clock"
version = "0.1.0"
description = "SC-III blind local-Koopman/DMD complex phase-clock falsifier with moving-subspace continuation"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "pybind11>=3.0", "networkx>=3.4"]

[project.scripts]
sst-modal-clock = "sst_modal_clock.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


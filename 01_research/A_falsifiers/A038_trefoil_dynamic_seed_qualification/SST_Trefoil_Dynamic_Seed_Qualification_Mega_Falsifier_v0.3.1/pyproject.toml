[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-trefoil-dynamic-seed-falsifier"
version = "0.3.1"
description = "Evidence-sealed trefoil dynamic seed qualification with explicit numerical and physics verdicts"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "pybind11>=3.0", "scipy>=1.14"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["sst_seed_falsifier"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-maxwell-falsifier"
version = "0.1.0"
description = "Seven Maxwell-inspired falsification/audit routes for Swirl-String Theory"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.scripts]
maxwell-sst = "maxwell_sst.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["maxwell_sst*"]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "sst-ruban-t23-reproduction"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "scipy>=1.13,<2", "numba>=0.60"]
[tool.setuptools]
packages = ["ruban_falsifier"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=70", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-knotplot-qhp-sweep-generator"
version = "0.1.1"
description = "Deterministic QHP geometry-sweep generator for SST KnotPlot relaxed-knot datasets"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=70", "wheel", "pybind11>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-gfcc-blind"
version = "0.2.0"
description = "Dimensionless blind geometry-field covariance, temporal-memory, transverse-mode and Floquet-gated falsifier with Python reference and optional C++17 kernels"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "matplotlib>=3.8"]

[project.scripts]
sst-gfcc-blind = "sst_gfcc_blind.cli:main"

[tool.setuptools]
packages = ["sst_gfcc_blind", "sst_gfcc_blind.native_ext"]

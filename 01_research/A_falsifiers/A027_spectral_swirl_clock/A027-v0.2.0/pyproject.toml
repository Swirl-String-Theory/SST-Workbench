[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-v-arrow-falsifier"
version = "0.2.0"
description = "Blind spectral falsifier for a universal propagation speed in SST vortex-knot dynamics"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.12", "pandas>=2.2", "matplotlib>=3.8"]

[project.scripts]
sst-varrow = "sst_v_arrow_falsifier.cli:main"

[tool.setuptools]
packages = ["sst_v_arrow_falsifier"]

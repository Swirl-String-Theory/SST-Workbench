# SST-Workbench — projectgebonden lokale Codex / ChatGPT Work-configuratie
# Installatie: C:\workspace\projects\SST-Workbench\.codex\config.toml
# Werkt wanneer de lokale map als vertrouwd project is geopend.
# Let op: deze configuratie geeft autonome schrijf- en uitvoerrechten
# binnen de sandbox; maak vooraf een herstelpunt / Git-commit.

# Geen tussentijdse goedkeuringsvragen voor acties die de sandbox toestaat.
# Activiteiten buiten de sandbox worden NIET automatisch toegestaan.
approval_policy = "never"

# Schrijven en uitvoeren binnen de geopende werkmap, zonder rechten
# over de volledige pc te geven.
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
# Alle Workbench-submappen: broncode, falsifiers, datasets, outputs, rapporten.
# TOML-literal string voorkomt ontsnappingsproblemen met Windows-paden.
writable_roots = ['C:\workspace\projects\SST-Workbench']

# Voor bijvoorbeeld package-installatie, dependency downloads en broncontrole.
# Netwerkrechten kunnen alsnog worden beperkt door beheerde policies.
network_access = true

[features]
# Gebruik de sterkere MXC-Windows-sandbox als het systeem die ondersteunt.
prefer_mxc = true

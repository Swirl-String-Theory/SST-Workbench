[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maxwell-sst-kinetic-falsifier"
version = "0.1.0"
description = "Preregistered falsifier framework for the Maxwell–SST kinetic closure and internal-mode thermodynamic gate."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sst-maxwell-falsify = "maxwell_sst_falsifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

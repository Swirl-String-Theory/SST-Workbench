[build-system]
requires = ["setuptools>=70", "wheel", "pybind11>=3.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-wien-planck-field-matter-falsifier"
version = "0.2.0"
description = "Blind Wien-Planck SST field-matter closure and universal-action falsifier"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "pybind11>=3.0"]

[tool.setuptools]
packages = ["sst_wp", "sst_wp.native_ext"]

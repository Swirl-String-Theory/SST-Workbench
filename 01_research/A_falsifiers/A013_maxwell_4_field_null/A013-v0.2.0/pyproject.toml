[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-maxwell-falsifier-4"
version = "0.2.0"
description = "4_ Maxwell-inspired falsifier workbench for Swirl-String Theory"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.scripts]
maxwell-sst-4 = "maxwell_sst.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["maxwell_sst*", "native_ext*"]

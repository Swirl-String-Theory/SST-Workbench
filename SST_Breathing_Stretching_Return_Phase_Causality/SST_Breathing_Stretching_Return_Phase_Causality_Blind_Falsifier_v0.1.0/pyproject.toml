[build-system]
requires = ["setuptools>=70", "wheel", "pybind11>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-bsrp-falsifier"
version = "0.1.1"
description = "Blind Breathing-Stretching-Return-Phase Causality Falsifier for closed vortex filaments"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "pybind11>=3.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires=["setuptools>=70","wheel"]
build-backend="setuptools.build_meta"
[project]
name="sst-finite-core-phase-falsifier"
version="0.3.0"
description="Blind finite-core axial/toroidal eigenmode and self-generated phase-delay falsifier"
requires-python=">=3.11"
dependencies=["numpy>=2.0","scipy>=1.14","pyarrow>=16"]
[tool.setuptools]
package-dir={""="src"}
[tool.setuptools.packages.find]
where=["src"]

[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "sst-fermat-pybind-research"
version = "0.1.1"
description = "Standalone Python+C++ pybind11 research harness for SST Fermat-critical and knot-tube diagnostics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["fermat_ext"]
